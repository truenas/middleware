[Unit]
After=middlewared.service

[Service]
# `+` runs the check unsandboxed as root, since some of these units run sandboxed as www-data.
# midclt exits 0 whatever the answer, so jq turns the entitlement into the exit status.
ExecCondition=+/bin/sh -c 'midclt call truenas.entitlements.check WEBSHARE | jq -e .entitled > /dev/null'
