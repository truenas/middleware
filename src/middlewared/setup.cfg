[flake8]
extend-ignore = A003,A005,LIT001,LIT003,LIT101
extend-exclude = */alembic/versions/*
per-file-ignores =
    src/middlewared/middlewared/api/**/__init__.py:F401,F403,F405
    src/middlewared/middlewared/utils/secrets.py:I251
    src/middlewared/middlewared/test/*:I251
    src/middlewared_docs/generate_docs.py:E402
    src/middlewared_docs/docs/conf.py:A001
max-line-length = 120
banned-modules =
    pydantic.SecretStr = Use pydantic.Secret[str]
    secrets = Use middlewared.utils.secrets

[importlinter]
root_package = middlewared
include_external_packages = True
contract_types =
    api_schema: middlewared_import_linter.APISchemaContract

[importlinter:contract:api_schema]
name = API schemas do not import prohibited modules
type = api_schema

[importlinter:contract:hardware_layers]
name = Hardware package layers
type = layers
layers =
    probe
    classify | detect
    types
containers =
    middlewared.utils.hardware

[importlinter:contract:entitlements_layers]
name = Entitlement package layers
type = layers
layers =
    system
    policy
    matrix
    engine
    facts
containers =
    middlewared.utils.entitlements

[importlinter:contract:license_layers]
name = License package layers
type = layers
layers =
    daemon | legacy
    constants | types
containers =
    middlewared.utils.license

[importlinter:contract:hardware_isolation]
name = Hardware package stays out of the service framework
type = forbidden
source_modules =
    middlewared.utils.hardware
forbidden_modules =
    middlewared.service
    middlewared.utils.entitlements
    middlewared.utils.license

[importlinter:contract:license_isolation]
name = License package stays out of the service framework
type = forbidden
source_modules =
    middlewared.utils.license
forbidden_modules =
    middlewared.service
    middlewared.utils.entitlements

[importlinter:contract:entitlements_isolation]
name = Entitlement engine stays out of the service framework
type = forbidden
source_modules =
    middlewared.utils.entitlements
forbidden_modules =
    middlewared.service

[importlinter:contract:applicability_layers]
name = Alert applicability package layers
type = layers
layers =
    vocabulary
    engine
containers =
    middlewared.alert.applicability

